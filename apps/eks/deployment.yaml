# Two small deployments that run on EKS and prove cross-VPC connectivity.
#
#   peering-client  -> UPSTREAM_URL = private DNS name   -> traffic goes over VPC PEERING
#   lattice-client  -> UPSTREAM_URL = Lattice DNS name   -> traffic goes through VPC LATTICE
#
# Placeholders (${...}) are filled in by `envsubst` (see the root README, step "Deploy to EKS"):
#   IMAGE_URI    stack output  orderflow-<env>-compute  ImageUri
#   ENV_NAME     dev | qa | prod
#   PEERING_URL  http://internal.<env>.orderflow.internal              (Route 53 private zone)
#   LATTICE_URL  stack output  orderflow-<env>-discovery  LatticeServiceUrl
#
# Both pods run the SAME image as the ECS service; behaviour comes from environment variables.
apiVersion: v1
kind: Namespace
metadata:
  name: orderflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peering-client
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: peering-client }
  template:
    metadata:
      labels: { app: peering-client }
    spec:
      containers:
        - name: app
          image: ${IMAGE_URI}
          ports:
            - containerPort: 8080
          env:
            - { name: ROLE, value: eks-client-peering }
            - { name: PLATFORM, value: eks }
            - { name: ENV_NAME, value: "${ENV_NAME}" }
            - { name: UPSTREAM_URL, value: "${PEERING_URL}" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: peering-client
  namespace: orderflow
spec:
  type: ClusterIP
  selector: { app: peering-client }
  ports:
    - { port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattice-client
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: lattice-client }
  template:
    metadata:
      labels: { app: lattice-client }
    spec:
      containers:
        - name: app
          image: ${IMAGE_URI}
          ports:
            - containerPort: 8080
          env:
            - { name: ROLE, value: eks-client-lattice }
            - { name: PLATFORM, value: eks }
            - { name: ENV_NAME, value: "${ENV_NAME}" }
            - { name: UPSTREAM_URL, value: "${LATTICE_URL}" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: lattice-client
  namespace: orderflow
spec:
  type: ClusterIP
  selector: { app: lattice-client }
  ports:
    - { port: 80, targetPort: 8080 }
